seed: 2025
tweedie_power: 1.5
lines: [motor, buildings, contents]
markets:
  w1: {raw_dir: data/raw/w1}
  w2: {raw_dir: data/raw/w2}
validation:
  train_years: [2021, 2022, 2023]
  valid_years: [2024]
assumptions:   # mirror logs/assumptions_register.md; human gate G3 (approved 2026-10-22, decision #7)
  trend_2025:    # annual, applied on top of a model that includes sum_insured / rating factors
    motor: {low: 0.03, central: 0.05, high: 0.07}
    buildings: {low: 0.04, central: 0.05, high: 0.07}
    contents: {low: 0.025, central: 0.035, high: 0.045}
  development:
    basis: cost              # cost-based IBNR factors (count-based kept for comparison)
    mature_years: [2021, 2022]
    severity_cap: 100000     # cap used inside the expected-severity override
    expected_severity:       # Bornhuetter-Ferguson style override for immature BI
      - {line: motor, peril: bodily_injury, years: [2023, 2024], base_years: [2021, 2022],
         trend: {low: 0.0, central: 0.03, high: 0.05}}
  large_loss_cap: {motor: 100000, buildings: 100000, contents: 25000}   # A3 final (decision #9)
  large_loss_sensitivity:   # decisions #6/#9: sensitivity only; central keeps 11,894,276.93
    CL30973963: 1189427.69
  weather_mode: same_year   # A8 interim (decision #8); long_run = sensitivity
gbm_configs:   # LightGBM Tweedie settings by name (scripts/run_gbm_tuning.py, scripts/run_stack.py)
  c0: {stop: policy, params: {}}
  c7: {stop: time, params: {learning_rate: 0.03, num_leaves: 7, min_child_samples: 2000}}
model_by_line:   # G4: final predictor per line = 50/50 blend of GLM and the named GBM config
  motor: {gbm: c0}
  buildings: {gbm: c0}
  contents: {gbm: c0}
